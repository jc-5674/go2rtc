name: onvif-bridge image

# Builds the custom onvif-bridge image (root Dockerfile: go2rtc + ffmpeg +
# font-droid) and publishes it to GitHub Container Registry on every push to
# master. GHCR uses the automatic GITHUB_TOKEN — no DockerHub creds needed.
#
# Deploy loop becomes: git push → image auto-builds → in Portainer, recreate
# the container with re-pull ON (it's a real registry image now). One action.
#
#   image: ghcr.io/jc-5674/onvif-bridge:latest
#
# NOTE: builds linux/amd64 (the services VM). If that host is arm64, change
# `platforms` to linux/arm64 (or add it for both).

on:
  workflow_dispatch:
  push:
    branches:
      - 'master'

jobs:
  build-push:
    name: Build & push onvif-bridge
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/onvif-bridge:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
