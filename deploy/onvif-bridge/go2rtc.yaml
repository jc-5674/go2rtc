# go2rtc ONVIF bridge — pilot config for cel-lan-lab-01
#
# Architecture:
#   - One go2rtc container, host networking
#   - Each upstream camera = one stream entry + one onvif.profile entry
#   - Each profile listens on its own port; Nx Witness adds it as host:port
#   - GetDeviceInformation per profile spoofs an Nx-recognised encoder
#     identity so each virtual camera consumes an Encoder license, not Pro.
#
# Stream parameter convention:
#   "<stream-name>#res=WxH#codec=X#framerate=N#kbps=N#audio=X"
#
#   res, codec, framerate, kbps, audio — these advertise the profile to Nx
#   via ONVIF SOAP. They are MOSTLY COSMETIC: Nx detects the real codec,
#   resolution and framerate from the RTSP SDP at connect-time. Wrong-by-a-bit
#   is fine; getting them roughly right just makes Nx's catalog UI accurate.
#   The encoder-license trick is keyed on Manufacturer+Model in
#   `device_info`, not these values.
#
# Filling in the pilot:
#   Replace the 5 <FILL ME> placeholders below with the pilot camera's
#   RTSP URLs and the spoofed encoder identity (Manufacturer + Model strings
#   that Nx currently recognises from the working Dahua NVR — read them off
#   Nx's camera info panel).

api:
  origin: "*"
  listen: ":1984"

log:
  level: info
  api: trace            # ONVIF SOAP visible during pilot validation
  onvif: trace
  rtsp: warn

streams:
  # One stream entry per upstream camera. go2rtc opens ONE upstream RTSP
  # session and fans out to N downstream consumers (Nx, EVIDION, etc.) —
  # this replaces the Dahua's restream consolidation function.
  cam01:
    - "<FILL ME — pilot cam main-stream RTSP URL e.g. rtsp://user:pass@192.168.x.y:554/cam/realmonitor?channel=1&subtype=0>"
    - "<FILL ME — pilot cam sub-stream RTSP URL e.g. rtsp://user:pass@192.168.x.y:554/cam/realmonitor?channel=1&subtype=1>"

onvif:
  profiles:
    - name: cam01
      port: 8081
      streams:
        # Default: H.264 1080p with AAC audio. ONVIF audio Encoding values
        # the spec defines: G711, G726, AAC. If your camera sends PCMA/PCMU
        # use audio=G711. If it doesn't send audio, drop the audio= clause.
        - "cam01#res=1920x1080#codec=H264#framerate=15#kbps=4000#audio=AAC"
        - "cam01#res=704x480#codec=H264#framerate=15#kbps=512"

        # If your pilot camera is H.265 + AAC audio, comment the two lines
        # above and uncomment these instead (sub-streams typically stay
        # H.264 even when main is H.265):
        # - "cam01#res=3840x2160#codec=H265#framerate=15#kbps=8000#audio=AAC"
        # - "cam01#res=704x480#codec=H264#framerate=15#kbps=512"

      device_info:
        # These five strings drive Nx's license-class decision.
        # Set them to whatever Nx Witness currently shows for the
        # working Dahua NVR (Server admin → Camera → Manufacturer/Model).
        manufacturer:     "<FILL ME — e.g. Dahua>"
        model:            "<FILL ME — e.g. DH-NVR5208-8P-4KS2 (the encoder Nx currently licenses on)>"
        firmware_version: "<FILL ME — e.g. 4.001.0000000.5>"
        serial_number:    "PILOT-CAM-01"     # MUST be unique per virtual device — Nx dedupes on serial
        hardware_id:      "1.00"

# Adding more cameras: copy the cam01 block under streams + onvif.profiles,
# increment port (8082, 8083, …), keep serial_number unique. See README.md.
